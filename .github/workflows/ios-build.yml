name: iOS bouwen (controle)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen installeren
        run: brew install xcodegen
      - name: Xcode-project maken
        run: xcodegen generate
      - name: Bouwen voor de simulator (zonder ondertekening)
        run: |
          set -o pipefail
          xcodebuild -project VercoTelefoon.xcodeproj -scheme VercoTelefoon \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Fouten tonen
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -50 | while read -r l; do echo "::error::$l"; done
      - name: Bouwlog bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
