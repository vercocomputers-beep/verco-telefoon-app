name: Naar TestFlight

# Bouwt een ondertekende versie en zet die in TestFlight (App Store Connect).
# Start: GitHub → Actions → "Naar TestFlight" → Run workflow. Of automatisch bij een tag als v0.6.0.
# Nodig (GitHub → Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   Team ID (10 tekens, Apple Developer → Membership)
#   ASC_KEY_ID      Key ID van de App Store Connect API-sleutel
#   ASC_ISSUER_ID   Issuer ID (App Store Connect → Gebruikers en toegang → Integraties)
#   ASC_KEY_P8      inhoud van het AuthKey_XXXX.p8-bestand
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  testflight:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      HAS_KEYS: ${{ secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Sleutels aanwezig?
        if: env.HAS_KEYS != 'true'
        run: |
          echo "::error::De Apple-sleutels staan nog niet bij GitHub (Settings → Secrets → Actions). Zie README: TestFlight."
          exit 1
      - uses: actions/checkout@v5
      - name: XcodeGen installeren
        run: brew install xcodegen
      - name: Linphone-bouwdoos ophalen
        run: bash scripts/linphone-sdk.sh
      - name: Xcode-project maken
        run: xcodegen generate
      - name: App Store Connect-sleutel klaarzetten
        run: |
          mkdir -p ~/private_keys
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      - name: Archief maken (ondertekend)
        run: |
          set -o pipefail
          xcodebuild -project VercoTelefoon.xcodeproj -scheme VercoTelefoon -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/VercoTelefoon.xcarchive archive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=$((100 + ${{ github.run_number }})) \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} 2>&1 | tee archive.log
      - name: Naar App Store Connect / TestFlight sturen
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/VercoTelefoon.xcarchive -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} 2>&1 | tee export.log
      - name: Fouten tonen
        if: failure()
        run: |
          cat archive.log export.log 2>/dev/null | grep -E "error:|Error" | sort -u | head -40 | while read -r l; do echo "::error::$l"; done
      - name: Sleutel opruimen
        if: always()
        run: rm -rf ~/private_keys
