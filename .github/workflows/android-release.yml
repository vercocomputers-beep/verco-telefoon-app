name: Android release (AAB voor Google Play)

# Bouwt een ONDERTEKENDE AAB (Android App Bundle) voor upload naar de Google Play Console.
# Handmatig starten: tabblad Actions -> "Android release (AAB voor Google Play)" -> Run workflow.
# Vereist vier repository-secrets (Settings -> Secrets and variables -> Actions):
#   UPLOAD_KEYSTORE_BASE64    (de upload-sleutel .jks, base64)
#   UPLOAD_KEYSTORE_PASSWORD  (wachtwoord van de keystore)
#   UPLOAD_KEY_ALIAS          (verco-upload)
#   UPLOAD_KEY_PASSWORD       (zelfde wachtwoord)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Upload-sleutel klaarzetten
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Secret UPLOAD_KEYSTORE_BASE64 ontbreekt. Voeg eerst de vier upload-secrets toe."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: AAB bouwen
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../VercoTelefoon.aab
      - name: AAB als download (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: VercoTelefoon-aab
          path: VercoTelefoon.aab
          if-no-files-found: error
