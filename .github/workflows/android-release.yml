name: Android release (bouwen + naar Google Play)

# Bouwt een ONDERTEKENDE AAB en uploadt die automatisch naar Google Play.
# Starten:
#   - automatisch bij een versie-tag:  git tag v0.2.1 && git push --tags
#   - of handmatig: tab Actions -> deze workflow -> Run workflow (kies de track).
#
# Vereiste repository-secrets (Settings -> Secrets and variables -> Actions):
#   UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON   (JSON van het Google Play-serviceaccount; zonder dit wordt
#                                de AAB wel gebouwd maar niet naar Play geupload)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play-track"
        default: "internal"
        type: choice
        options: [internal, alpha, beta, production]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Versienaam bepalen
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.2.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload-sleutel klaarzetten
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Secret UPLOAD_KEYSTORE_BASE64 ontbreekt. Voeg eerst de vier keystore-secrets toe."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: AAB bouwen
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../VercoTelefoon.aab

      - name: AAB bewaren als download
        uses: actions/upload-artifact@v4
        with:
          name: VercoTelefoon-aab
          path: VercoTelefoon.aab
          if-no-files-found: error

      - name: Play-upload mogelijk?
        id: play
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Geen Play-serviceaccount ingesteld - AAB is gebouwd (zie Artifacts) maar niet naar Google Play geupload."
          fi

      - name: Naar Google Play uploaden
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.verco.telefoon
          releaseFiles: VercoTelefoon.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
