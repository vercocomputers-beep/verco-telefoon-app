name: Android release (bouwen + naar Google Play)

# Bouwt een ONDERTEKENDE AAB en uploadt die automatisch naar Google Play.
#  - Automatisch bij elke app-wijziging op main  -> track 'internal' (interne test).
#  - Handmatig (Actions -> Run workflow)          -> kies zelf de track (incl. production).
#
# Eenmalig instellen (Settings -> Secrets and variables -> Actions):
#   UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON   (zonder dit wordt de AAB wel gebouwd maar niet geupload)
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-release.yml"]
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play-track"
        default: "internal"
        type: choice
        options: [internal, alpha, beta, production]

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Versie bepalen
        id: ver
        run: |
          echo "track=${{ github.event.inputs.track || 'internal' }}" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
          echo "name=0.3.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Upload-sleutel klaarzetten
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Secret UPLOAD_KEYSTORE_BASE64 ontbreekt. Voeg eerst de vier keystore-secrets toe."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: AAB bouwen
        working-directory: android
        env:
          BUILD_NUMBER: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../VercoTelefoon.aab

      - name: AAB bewaren als download
        uses: actions/upload-artifact@v4
        with:
          name: VercoTelefoon-aab
          path: VercoTelefoon.aab
          if-no-files-found: error

      - name: Play-upload mogelijk?
        id: play
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Geen Play-serviceaccount ingesteld - AAB is gebouwd (zie Artifacts) maar niet geupload."
          fi

      - name: Naar Google Play uploaden
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.verco.telefoon
          releaseFiles: VercoTelefoon.aab
          track: ${{ steps.ver.outputs.track }}
          status: completed
