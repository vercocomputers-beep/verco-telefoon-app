# Xcode-project wordt op de Mac (of in GitHub Actions) gemaakt met XcodeGen:
#   bash scripts/linphone-sdk.sh && xcodegen generate
name: VercoTelefoon
options:
  bundleIdPrefix: org.verco
  deploymentTarget:
    iOS: "16.0"
packages:
  # lokale kopie, opgehaald met scripts/linphone-sdk.sh (vaste versie, zie dat script)
  linphonesw:
    path: Packages/linphone-sdk
targets:
  VercoTelefoon:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: linphonesw
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Verco Telefoon
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "4"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, voip]
        NSMicrophoneUsageDescription: "Nodig om te kunnen bellen."
        NSCameraUsageDescription: "Nodig om de QR-code van de telefooncentrale te scannen (en voor videobellen)."
        NSLocalNetworkUsageDescription: "Nodig om de telefooncentrale op het netwerk van kantoor te bereiken."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: org.verco.telefoon
            CFBundleURLSchemes: [verco-telefoon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.verco.telefoon
        PRODUCT_NAME: VercoTelefoon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
